<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/png" sizes="32x32" href="/favicon-32.png" />
    <link rel="icon" type="image/png" sizes="192x192" href="/icon-192.png" />
    <link rel="apple-touch-icon" sizes="180x180" href="/apple-touch-icon.png" />
    <link rel="manifest" href="/manifest.webmanifest" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="theme-color" content="#ffffff" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="default" />
    <meta name="apple-mobile-web-app-title" content="Kaiira" />
    <title>Kaiira — Shop Online</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Outfit:wght@100..900&display=swap"
      rel="stylesheet"
    />
    <style>
      /* Critical instantaneous splash screen rendered directly in HTML */
      /* display: none by default so a plain browser tab (website, iOS Safari) never sees it */
      #pwa-instant-splash {
        display: none;
        position: fixed;
        inset: 0;
        z-index: 99999;
        align-items: center;
        justify-content: center;
        background-color: #ffffff;
        transition: opacity 0.4s cubic-bezier(0.16, 1, 0.3, 1), visibility 0.4s;
      }
      @media (display-mode: standalone) {
        #pwa-instant-splash {
          display: flex;
        }
      }
      #pwa-instant-splash.hidden-splash {
        opacity: 0;
        visibility: hidden;
        pointer-events: none;
      }
      @keyframes pwaLetterFadeIn {
        0% {
          opacity: 0;
          transform: translateY(6px) scale(0.96);
        }
        100% {
          opacity: 1;
          transform: translateY(0) scale(1);
        }
      }
      .pwa-splash-path {
        opacity: 0;
        transform-origin: center;
        animation: pwaLetterFadeIn 450ms cubic-bezier(0.2, 0.8, 0.2, 1) forwards;
      }
      .pwa-p-1 { animation-delay: 0.05s; }
      .pwa-p-2 { animation-delay: 0.12s; }
      .pwa-p-3 { animation-delay: 0.19s; }
      .pwa-p-4 { animation-delay: 0.26s; }
      .pwa-p-5 { animation-delay: 0.33s; }
      .pwa-p-6 { animation-delay: 0.40s; }
    </style>
  </head>
  <body class="bg-white text-black antialiased">
    <!-- Immediate Zero-Delay Native Splash Screen -->
    <div id="pwa-instant-splash" aria-hidden="true">
      <svg
        viewBox="0 0 236 44"
        fill="none"
        xmlns="http://www.w3.org/2000/svg"
        style="height: 44px; width: auto; color: #000000;"
        aria-label="Kaiira"
      >
        <path d="M10 8V36M32 8L11 22L32 36" stroke="currentColor" stroke-width="4.5" stroke-linecap="round" stroke-linejoin="round" class="pwa-splash-path pwa-p-1" />
        <path d="M48 36L64 8L80 36" stroke="currentColor" stroke-width="4.5" stroke-linecap="round" stroke-linejoin="round" class="pwa-splash-path pwa-p-2" />
        <path d="M96 8V36" stroke="currentColor" stroke-width="4.5" stroke-linecap="round" class="pwa-splash-path pwa-p-3" />
        <path d="M112 8V36" stroke="currentColor" stroke-width="4.5" stroke-linecap="round" class="pwa-splash-path pwa-p-4" />
        <path d="M128 36V8H148C158 8 158 22 148 22H128M141 22C148 22 153 27 157 36" stroke="currentColor" stroke-width="4.5" stroke-linecap="round" stroke-linejoin="round" class="pwa-splash-path pwa-p-5" />
        <path d="M172 36L188 8L204 36" stroke="currentColor" stroke-width="4.5" stroke-linecap="round" stroke-linejoin="round" class="pwa-splash-path pwa-p-6" />
      </svg>
    </div>

    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
