    <style>
      /* Critical instantaneous splash screen rendered directly in HTML */
      /* display: none by default so a plain browser tab (website, iOS Safari) never sees it */
      #pwa-instant-splash {
        display: none;
        position: fixed;
        inset: 0;
        z-index: 99999;
        align-items: center;
        justify-content: center;
        background-color: #ffffff;
        transition: opacity 0.4s cubic-bezier(0.16, 1, 0.3, 1), visibility 0.4s;
      }
      @media (display-mode: standalone) {
        #pwa-instant-splash {
          display: flex;
        }
      }
      #pwa-instant-splash.hidden-splash {
        opacity: 0;
        visibility: hidden;
        pointer-events: none;
      }
      @keyframes pwaLetterFadeIn {
        0% {
          opacity: 0;
          transform: translateY(6px) scale(0.96);
        }
        100% {
          opacity: 1;
          transform: translateY(0) scale(1);
        }
      }
      .pwa-splash-path {
        opacity: 0;
        transform-origin: center;
        animation: pwaLetterFadeIn 450ms cubic-bezier(0.2, 0.8, 0.2, 1) forwards;
      }
      .pwa-p-1 { animation-delay: 0.05s; }
      .pwa-p-2 { animation-delay: 0.12s; }
      .pwa-p-3 { animation-delay: 0.19s; }
      .pwa-p-4 { animation-delay: 0.26s; }
      .pwa-p-5 { animation-delay: 0.33s; }
      .pwa-p-6 { animation-delay: 0.40s; }
    </style>
  </head>
